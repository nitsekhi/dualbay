[project]
name = "dualbay"
version = "0.1.0"
description = "Water quality retrieval and digital twin for Tokyo Bay and Sagami Bay (YNU, Higa Lab)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
inventory = ["pystac-client>=0.7", "earthaccess>=0.9"]
raster = ["xarray>=2024.1", "netCDF4>=1.6", "zarr>=2.16"]
dev = ["pytest>=8.0"]

[project.scripts]
dualbay = "dualbay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
