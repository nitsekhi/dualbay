[project]
name = "dualbay"
version = "0.4.0"
description = "Water quality retrieval and digital twin for Tokyo Bay and Sagami Bay (YNU, Higa Lab)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lilya Javadova", email = "javadova-lilya-sw@ynu.jp"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "openpyxl>=3.1",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
inventory = ["pystac-client>=0.7", "earthaccess>=0.9"]
pace = ["earthaccess>=0.9", "h5py>=3.9", "matplotlib>=3.8"]
raster = ["xarray>=2024.1", "netCDF4>=1.6", "zarr>=2.16"]
dev = ["pytest>=8.0"]

[project.scripts]
dualbay = "dualbay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dualbay = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
